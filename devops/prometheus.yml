global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'exam-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['exam-app:8080']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
